server {    
    listen 80;
    server_name _;

    client_max_body_size 512M;

    # Block public access to internal-only endpoints.
    location ~* ^/api/notifications/internal {
        return 404;
    }

    location ~* ^/api/media/internal {
        return 404;
    }

    location /api/auth/ {
        include /etc/nginx/conf.d/cors.inc;
        proxy_pass http://auth-service.fluxon.local:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; 
    }

    location /api/jobs {
        include /etc/nginx/conf.d/cors.inc;
        proxy_pass http://job-service.fluxon.local:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/media {
        client_max_body_size 512M;
        include /etc/nginx/conf.d/cors.inc;
        proxy_pass http://media-service.fluxon.local:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/notifications {
        include /etc/nginx/conf.d/cors.inc;
        proxy_pass http://notification-service.fluxon.local:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
